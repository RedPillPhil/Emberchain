<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ember Ball — Emberchain</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0a0a;
        --fg: #e8e0d8;
        --primary: #ff5a00;
        --muted: #8a8078;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
        padding: 2rem;
      }
      main {
        max-width: 32rem;
        text-align: center;
        border: 1px solid rgba(255, 90, 0, 0.25);
        background: rgba(18, 14, 12, 0.92);
        padding: 2rem 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 1.4rem;
      }
      p { color: var(--muted); line-height: 1.6; }
      a {
        color: var(--primary);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        text-decoration: none;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ember Ball</h1>
      <p>
        Crypto basketball GM for Emberchain. The game bundle is still building on
        the server — check back shortly or open the wallet sidebar link again
        after the next deploy finishes.
      </p>
      <p><a href="/wallet">Back to Ember Web Wallet</a></p>
    </main>
  </body>
</html>
