<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>GAME_NAME — Crypto League</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#07080b" />
		<meta name="color-scheme" content="dark" />
		<meta
			name="description"
			content="Ember Ball Crypto League — Draft Day-style GM basketball on Emberchain. Claim an NFT franchise, scout college &amp; high school, run your team in-browser."
		/>
		<link rel="manifest" href="/ember-ball/manifest.webmanifest" />
		<link rel="icon" href="/ember-ball/img/ember-ball-logo.png" />
		<link rel="apple-touch-icon" href="/ember-ball/img/ember-ball-logo.png" />
		<style>
			html,
			body,
			#root {
				height: 100%;
				margin: 0;
				background: #07080b;
				color: #f2f5fa;
				font-family: "Segoe UI", sans-serif;
			}
		</style>
		MODULEPRELOADS
		<script>
			window.bbgmBasePath = "/ember-ball";
			window.bbgmVersion = "VERSION_NUMBER";
			window.useSharedWorker = false;
			window.mobile = false;
			window.enableLogging = false;
			window.emberLeague = true;

			function asset(path) {
				if (
					path.indexOf(window.bbgmBasePath + "/") === 0 ||
					path === window.bbgmBasePath
				) {
					return path;
				}
				return window.bbgmBasePath + path;
			}

			(function () {
				var NativeWorker = Worker;
				Worker = function (url, options) {
					if (typeof url === "string") {
						var doubled =
							window.bbgmBasePath + "/" + window.bbgmBasePath + "/";
						if (url.indexOf(doubled) === 0) {
							url = url.slice(window.bbgmBasePath.length);
						} else if (
							url.indexOf("/gen/") === 0 &&
							url.indexOf(window.bbgmBasePath + "/") !== 0
						) {
							url = window.bbgmBasePath + url;
						}
					}
					return new NativeWorker(url, options);
				};
			})();
		</script>
		BANNER_ADS_CODE
	</head>
	<body>
		<div id="root"></div>
		<link rel="stylesheet" href="/ember-ball/desktop.css" />
		<script type="module">
			const s = document.createElement("script");
			s.type = "module";
			s.src = asset("/gen/ui-" + window.bbgmVersion + ".js");
			document.body.appendChild(s);
		</script>
	</body>
</html>
