<!doctype html>
<html lang="en" class="h-100">
	<head>
		<meta charset="utf-8" />
		<title>GAME_NAME</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0c0c0e" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="color-scheme" content="light dark" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<link rel="manifest" href="/ember-ball/manifest.webmanifest" />
		<link rel="icon" href="/ember-ball/img/ember-ball-logo.png" />
		<link rel="apple-touch-icon" href="/ember-ball/img/ember-ball-logo.png" />

		<style>
			:root {
				color-scheme: dark;
				--embr-bg: #0c0c0e;
				--embr-fg: #f4f4f5;
				--embr-muted: #9a9aa3;
				--embr-orange: #ff5a00;
				--embr-heat: #ffb020;
				--embr-display: "Barlow Condensed", "Arial Narrow", sans-serif;
				--embr-body: "Barlow", "Segoe UI", sans-serif;
			}
			html,
			body {
				background: var(--embr-bg);
				color: var(--embr-fg);
				font-family: var(--embr-body);
			}
			body {
				padding-top: 0 !important;
			}
			#content {
				min-height: 100vh;
				justify-content: center;
			}
			.ember-startup-wrap {
				max-width: 420px;
				margin: 0 auto;
				padding: 2.5rem 1.25rem 3rem;
				text-align: center;
			}
			.ember-startup-logo {
				width: 88px;
				height: 88px;
				object-fit: contain;
				margin: 0 auto 1.25rem;
				display: block;
				filter: drop-shadow(0 0 24px rgba(255, 90, 0, 0.35));
				animation: ember-startup-pulse 2.2s ease-in-out infinite;
			}
			@keyframes ember-startup-pulse {
				0%,
				100% {
					transform: scale(1);
					opacity: 1;
				}
				50% {
					transform: scale(1.04);
					opacity: 0.92;
				}
			}
			.ember-startup-title {
				font-family: var(--embr-display);
				font-size: 1.65rem;
				font-weight: 800;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				margin: 0 0 0.35rem;
				background: linear-gradient(90deg, var(--embr-heat), var(--embr-orange));
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
			.ember-startup-version {
				font-size: 0.72rem;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				color: var(--embr-muted);
				margin: 0 0 1.75rem;
			}
			.ember-startup-status {
				text-align: left;
				border: 1px solid rgba(255, 255, 255, 0.08);
				background: rgba(20, 20, 22, 0.92);
				padding: 1rem 1.1rem;
				font-size: 0.92rem;
				line-height: 1.7;
				color: var(--embr-muted);
			}
			.ember-startup-status strong {
				color: var(--embr-orange);
				font-weight: 700;
			}
			#startup-error {
				text-align: left;
			}
		</style>

		<meta
			name="description"
			content="Ember Ball — crypto basketball on Emberchain. NFT teams, GMbucks, AI desk headlines. Create offline or on-chain leagues."
		/>

		MODULEPRELOADS

		<script>
			window.bbgmBasePath = "/ember-ball";
			window.bbgmVersion = "VERSION_NUMBER";
			window.useSharedWorker = false;

			window.mobile = window.screen.width < 768 || window.screen.height < 768;

			function asset(path) {
				if (
					path.indexOf(window.bbgmBasePath + "/") === 0 ||
					path === window.bbgmBasePath
				) {
					return path;
				}
				return window.bbgmBasePath + path;
			}

			(function () {
				var NativeWorker = Worker;
				Worker = function (url, options) {
					if (typeof url === "string") {
						var doubled =
							window.bbgmBasePath + "/" + window.bbgmBasePath + "/";
						if (url.indexOf(doubled) === 0) {
							url = url.slice(window.bbgmBasePath.length);
						} else if (
							url.indexOf("/gen/") === 0 &&
							url.indexOf(window.bbgmBasePath + "/") !== 0
						) {
							url = window.bbgmBasePath + url;
						}
					}
					return new NativeWorker(url, options);
				};
			})();

			function loadCSS(filename) {
				var el = document.createElement("link");
				el.setAttribute("rel", "stylesheet");
				el.setAttribute("href", filename);
				document.getElementsByTagName("head")[0].appendChild(el);
				return el;
			}
			function getTheme() {
				var dark = "dark-CSS_HASH_DARK";
				var light = "light-CSS_HASH_LIGHT";
				try {
					var local = localStorage.getItem("theme");
					if (local !== null) {
						return local === "dark" ? "dark" : "light";
					}
					// EMBR GM defaults to dark (NBA.com-style broadcast look)
					return "dark";
				} catch (error) {
					return "dark";
				}
			}
			function getThemeFilename(theme) {
				// Updates the scrollbar in Chrome - from the demo https://color-scheme-demo.glitch.me/ from https://web.dev/articles/color-scheme#demo
				document.documentElement.style.colorScheme = theme;

				if (theme === "dark") {
					return asset("/gen/dark-CSS_HASH_DARK.css");
				}
				return asset("/gen/light-CSS_HASH_LIGHT.css");
			}
			window.themeCSSLink = loadCSS(getThemeFilename(getTheme()));

			window.enableLogging =
				location.host.indexOf("GOOGLE_ANALYTICS_COOKIE_DOMAIN") >= 0;

			if (window.enableLogging) {
				var s = document.createElement("script");
				s.async = true;
				s.src =
					"https://www.googletagmanager.com/gtag/js?id=GOOGLE_ANALYTICS_ID";
				s.type = "text/javascript";
				document.head.appendChild(s);
				window.dataLayer = window.dataLayer || [];
				function gtag() {
					dataLayer.push(arguments);
				}
				gtag("consent", "default", {
					ad_storage: "granted",
					ad_user_data: "granted",
					ad_personalization: "granted",
					analytics_storage: "granted",
				});
				gtag("js", new Date());
				gtag("config", "GOOGLE_ANALYTICS_ID", {
					cookie_domain: "GOOGLE_ANALYTICS_COOKIE_DOMAIN",
					send_page_view: false,
				});
			}

			window.releaseStage = "unknown";
			if (location.host === "PLAY_SUBDOMAIN") {
				window.releaseStage = "production";
			} else if (location.host === "BETA_SUBDOMAIN") {
				window.releaseStage = "beta";
			} else if (
				location.host.startsWith("localhost") ||
				location.host.endsWith(".test")
			) {
				window.releaseStage = "development";
			}

			window.bugsnagKey = "BUGSNAG_API_KEY";
		</script>
		BANNER_ADS_CODE
	</head>

	<body class="h-100">
		<div id="content" class="h-100 d-flex flex-column">
			<div class="ember-startup-wrap">
				<img
					id="loading-icon"
					class="ember-startup-logo"
					src="/ember-ball/img/ember-ball-logo.png"
					width="88"
					height="88"
					alt="Ember Ball"
				/>
				<h1 class="ember-startup-title">Ember Ball</h1>
				<p class="ember-startup-version">GAME_NAME · vVERSION_NUMBER</p>
				<div class="ember-startup-status">
					<div id="startup-browser">Checking browser...</div>
					<noscript>
						<p>
							<b>Error!</b> JavaScript is disabled in your browser. Please
							enable JavaScript to play GAME_NAME.
						</p>
					</noscript>
					<div id="startup-ui"></div>
					<div id="startup-worker"></div>
				</div>

				<div
					class="alert alert-danger mt-3"
					id="startup-error"
					style="display: none"
				></div>
			</div>
		</div>

		<script>
			var startupUI = document.getElementById("startup-ui");
			var startupWorker = document.getElementById("startup-worker");
			var doneUI = false;
			var doneWorker = false;

			var timeoutID = setTimeout(function () {
				var errorMsg;
				if (doneUI && !doneWorker) {
					// From user reports in Chrome, possibly related to Chrome version updates in the background
					errorMsg =
						"<p>This should only take a few seconds on a fast connection.</p><p>If it's stuck loading the backend, <b>try restarting your browser</b>, sometimes that helps.</p>";
				} else if (!doneUI && !doneWorker) {
					errorMsg =
						'<p>This should only take a few seconds on a fast connection.</p><p>If it gets stuck for a while, read <a href="https://WEBSITE_ROOT/manual/debugging/">the debugging instructions</a> and <a href="https://WEBSITE_ROOT/contact/">ask for help</a> if it still isn\'t working.</p>';
				}

				var startupError = document.getElementById("startup-error");
				startupError.innerHTML = errorMsg;
				startupError.style.display = "block";
			}, 6000);

			function withGoodBrowser() {
				document.getElementById("startup-browser").innerHTML += " done!";
				startupUI.innerHTML = "Loading UI...";
				startupWorker.innerHTML = "Loading backend...";

				var body = document.getElementsByTagName("body").item(0);
				var script = document.createElement("script");
				script.type = "module"; // Needs to be module for modulepreload
				script.src = asset("/gen/ui-" + bbgmVersion + ".js");
				body.appendChild(script);
			}

			var count = 0;
			function withGoodUI() {
				startupUI.innerHTML += " done!";
				doneUI = true;
				count += 1;
				if (count === 2) {
					clearTimeout(timeoutID);
				}
			}
			function withGoodWorker() {
				startupWorker.innerHTML += " done!";
				doneWorker = true;
				count += 1;
				if (count === 2) {
					clearTimeout(timeoutID);
				}
			}

			function checkBrowser() {
				// Chrome <71, Firefox <105, Safari <14.1
				if (typeof TextDecoderStream === "undefined") {
					return false;
				}

				// Chrome <85
				if (!String.prototype.replaceAll) {
					return false;
				}

				// Safari <15.4
				if (typeof BroadcastChannel === "undefined") {
					// Actually it still works down to Safari 14.1 currently, just no longer "officially" supported so might as well not explicitly check here. Eventually when actually using worker modules, uncomment this
					//return false;
				}

				return true;
			}

			// Browser compatibility checks! Used to be like https://gist.github.com/jensarps/15f270874889e1717b3d but now the buggy old IE/Safari IndexedDB implementations are not supported for other reasons, like checkBrowser.
			function goodIDB(cb) {
				if (typeof indexedDB === "undefined" || !checkBrowser()) {
					cb("bad");
					return;
				}

				if (localStorage.getItem("goodIDB")) {
					cb("good");
					return;
				}

				var openRequest = indexedDB.open("__detectIDB_test2", 1);

				openRequest.onerror = function (evt) {
					console.error(evt.target.error);
					if (
						evt.target.error.message.indexOf("aborted") >= 0 ||
						evt.target.error.message.indexOf("full") >= 0
					) {
						// Error like "Version change transaction was aborted in upgradeneeded event handler." is probably quota error - try to continue loading BBGM and hope for the best
						cb("good");
					} else {
						cb("open-failed");
					}
				};

				openRequest.onsuccess = function (evt) {
					cb("good");
				};
			}

			goodIDB(function (idbResult) {
				if (idbResult !== "good") {
					var errorMsg;
					if (idbResult === "open-failed") {
						errorMsg =
							"<p><b>Error!</b> Cannot store data.</p><p>If you have disabled cookies in your browser, you must enable them to play GAME_NAME.</p>";
					} else {
						errorMsg =
							'<p><b>Error!</b> Your browser is not modern enough to run GAME_NAME. Current supported browsers include:</p><ul class="list-unstyled mb-0"><li>Chrome 85+</li><li>Firefox 115+</li><li>Safari 15.4+</li></ul>';
					}

					var startupError = document.getElementById("startup-error");
					startupError.innerHTML = errorMsg;
					startupError.style.display = "block";

					document.getElementById("loading-icon").style.animationPlayState =
						"paused";

					clearTimeout(timeoutID);
				} else {
					localStorage.setItem("goodIDB", "1");

					withGoodBrowser();
				}
			});
		</script>
	</body>
</html>
