kind = "web"
previewPath = "/ember-delta/"
title = "Ember Delta DEX"
version = "1.0.0"
id = "artifacts/ember-delta"
router = "path"

[[services]]
name = "web"
paths = [ "/ember-delta/" ]
localPort = 18912

[services.development]
run = "pnpm --filter @workspace/ember-delta run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ember-delta", "run", "build" ]
serve = "static"
publicDir = "artifacts/ember-delta/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18912"
BASE_PATH = "/ember-delta/"
