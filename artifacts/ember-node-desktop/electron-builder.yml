appId: org.emberchain.node
productName: Ember Node
copyright: Copyright © 2024 Emberchain

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - node_modules/**/*
  - "!node_modules/.cache"

asar: true
asarUnpack:
  # Native addons must be unpacked — asar can't execute them
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/better-sqlite3/build/Release/better_sqlite3.node"

# Rebuild native modules against the Electron Node.js ABI
npmRebuild: true

afterSign: null  # Set to your notarization script for macOS distribution

# ── macOS ──────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.finance
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

dmg:
  sign: false
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file

# ── Windows ────────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ember Node

# ── Linux ──────────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icons
  category: Finance
  desktop:
    Name: Ember Node
    Comment: Emberchain blockchain node
    Categories: Finance;Network;

# ── Auto-update ────────────────────────────────────────────────────────────────
# Uncomment and configure when you set up a release server:
# publish:
#   provider: github
#   owner: your-org
#   repo: ember-node
