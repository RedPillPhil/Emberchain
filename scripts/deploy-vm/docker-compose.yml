services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: emberchain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: emberchain
    volumes:
      - emberchain_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  emberchain_pg:
