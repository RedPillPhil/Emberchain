# Drop this file at: /etc/nginx/sites-available/emberchain-org
# Then: ln -sf /etc/nginx/sites-available/emberchain-org /etc/nginx/sites-enabled/
#       certbot --nginx -d emberchain.org -d www.emberchain.org (run AFTER DNS update)
#       nginx -t && systemctl reload nginx

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name emberchain.org www.emberchain.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name emberchain.org www.emberchain.org;

    # SSL — certbot populates these automatically
    ssl_certificate     /etc/letsencrypt/live/emberchain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emberchain.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/emberchain-wallet;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── BLOCK ALL MINING — zero upstream connections ───────────────────────────
    location ~ ^/api/mining {
        add_header Connection close always;
        add_header Retry-After 86400 always;
        return 503 "Mining endpoint disabled on this host. Use emberchain.duckdns.org for mining.";
    }

    # ── Proxy wallet API calls to Replit api-server ────────────────────────────
    location /api/ {
        proxy_pass          https://po-w-chain.replit.app;
        proxy_http_version  1.1;
        proxy_set_header    Host              po-w-chain.replit.app;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    Connection        "";
        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
