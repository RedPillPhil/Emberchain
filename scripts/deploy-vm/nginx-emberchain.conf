# EmberChain — static wallet + Ember Delta + local chain-node API
# Install: /etc/nginx/sites-available/emberchain
# SSL:     bash scripts/deploy-vm/fix-www-ssl.sh
#           (or certbot --nginx --expand -d emberchain.org -d www.emberchain.org -d emberchain.duckdns.org)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → canonical HTTPS apex (avoid https://www which needs www on the cert)
server {
    listen 80;
    listen [::]:80;
    server_name emberchain.org www.emberchain.org emberchain.duckdns.org;
    return 301 https://emberchain.org$request_uri;
}

# HTTPS www → apex (requires www on LetsEncrypt cert — run fix-www-ssl.sh)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.emberchain.org;

    ssl_certificate     /etc/letsencrypt/live/emberchain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emberchain.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://emberchain.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name emberchain.org emberchain.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/emberchain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emberchain.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/emberchain;
    index index.html;

    client_max_body_size 4m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ember Delta SPA (built with BASE_PATH=/ember-delta/)
    location = /ember-delta {
        return 301 /ember-delta/;
    }

    location /ember-delta/ {
        try_files $uri $uri/ /ember-delta/index.html;
    }

    # Ember Lotto SPA (built with BASE_PATH=/lotto/)
    location = /lotto {
        return 301 /lotto/;
    }

    location /lotto/ {
        try_files $uri $uri/ /lotto/index.html;
    }

    # Legacy Ember Ball path → WBBL (hosted at wbbl.site)
    location = /ember-ball {
        return 301 https://wbbl.site/;
    }

    location /ember-ball/ {
        return 301 https://wbbl.site/;
    }

    # ── chain-node — token registry list + rescan (scanner lives here) ──
    location ~ ^/api/(tokens|contracts/list|contracts/rescan)(/|$) {
        proxy_pass          http://127.0.0.1:8080;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ── api-server (PostgreSQL) — exchange escrow, token launch, contract ABI ops ──
    location ~ ^/api/(exchange|token-launch|contracts|tokens|onramp|mmo|mining-stats|chain-invaders|lotto|dex)(/|$) {
        proxy_pass          http://127.0.0.1:8081;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        $connection_upgrade;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # Quote the regex — nginx treats bare {40} as config syntax
    location ~ "^/api/wallets/0x[0-9a-fA-F]{40}/tokens$" {
        proxy_pass          http://127.0.0.1:8081;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
    }

    # ── api-server — dashboard reads (cached; chain-node :8080 is busy mining) ──
    location ~ ^/api/(chain/status|mining/status)$ {
        proxy_pass          http://127.0.0.1:8081;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }

    location ~ "^/api/wallets/0x[0-9a-fA-F]{40}$" {
        proxy_pass          http://127.0.0.1:8081;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }

    # ── chain-node — mining, DEX, community, bridge, RPC (PORT 8080) ──
    location /api/ {
        proxy_pass          http://127.0.0.1:8080;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        $connection_upgrade;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # Optional direct chain-node mount (legacy)
    location /chain-node/ {
        proxy_pass          http://127.0.0.1:8080/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Wallet SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
