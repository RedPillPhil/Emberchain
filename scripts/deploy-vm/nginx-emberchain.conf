# EmberChain nginx config — drop into /etc/nginx/sites-available/emberchain
# Then: sudo ln -sf /etc/nginx/sites-available/emberchain /etc/nginx/sites-enabled/
#       sudo certbot --nginx -d emberchain.org -d www.emberchain.org
#       sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name emberchain.org www.emberchain.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name emberchain.org www.emberchain.org;

    # SSL — certbot fills these in automatically
    ssl_certificate     /etc/letsencrypt/live/emberchain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emberchain.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Static wallet app ──────────────────────────────────────────────────────
    root /var/www/emberchain;
    index index.html;

    # gzip for static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache busted assets (hashed filenames) — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Mining API — proxied to Replit backend ─────────────────────────────────
    # Rate limiting is handled server-side in chain-proxy.ts (12 concurrent cap).
    location ~ ^/api/mining {
        proxy_pass          https://po-w-chain.replit.app;
        proxy_http_version  1.1;
        proxy_set_header    Host              po-w-chain.replit.app;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    Connection        "";
        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }

    # ── Proxy non-mining API calls to Replit api-server ───────────────────────
    location /api/ {
        proxy_pass          https://po-w-chain.replit.app;
        proxy_http_version  1.1;
        proxy_set_header    Host              po-w-chain.replit.app;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    Connection        "";
        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }

    # ── Proxy chain-node RPC to local chain-node process ──────────────────────
    location /chain-node {
        proxy_pass          http://127.0.0.1:8082;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    Connection        "";
    }

    # ── SPA fallback — all unknown paths → index.html ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
